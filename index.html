<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        header {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
        }

        header h1 {
            font-size: 45px;
            margin: 10px;
        }

        header p {
            font-size: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 30px 20px;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            margin: 25px 0;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        h2 {
            color: #60a5fa;
        }

        .skills span {
            display: inline-block;
            background: #2563eb;
            padding: 10px 18px;
            margin: 6px;
            border-radius: 20px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #7c3aed;
        }

        #contact {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #334155;
            border-radius: 15px;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #020617;
        }
    </style>
</head>

<body>

<header>
    <h1>Azizbek Xaynazarov</h1>
    <p>Student | Web Developer</p>
</header>

<div class="container">

    <div class="card">
        <h2>👋 Men haqimda</h2>
        <p>
            Salom! Men Azizbek. Men web dasturlash va yangi
            texnologiyalarni o‘rganishga qiziqaman.
        </p>
    </div>

    <div class="card">
        <h2>💻 Ko‘nikmalarim</h2>

        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>JavaScript</span>
            <span>Gaming</span>
        </div>
    </div>

    <div class="card">
        <h2>📞 Kontakt</h2>

        <button onclick="showContact()">
            Kontaktni ko‘rsatish
        </button>

        <div id="contact">
            <p>📧 Email: azizbekxaynazarov@gmail.com</p>
            <p>📱 Telegram: @xaynazarov_o11</p>

            <button onclick="hideContact()">
                Yopish
            </button>
        </div>
    </div>

</div>

<footer>
    © 2026 My Portfolio
</footer>

<script>
    function showContact() {
        document.getElementById("contact").style.display = "block";
    }

    function hideContact() {
        document.getElementById("contact").style.display = "none";
    }
</script>

</body>
</html>
